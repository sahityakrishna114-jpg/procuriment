<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" aria-label="Department of Civil Supplies Seal">
  <defs>
    <path id="textCircleTop" d="M 22,70 A 48,48 0 0,1 118,70" />
    <path id="textCircleBottom" d="M 118,70 A 48,48 0 0,1 22,70" />
  </defs>
  <!-- Outer double rings -->
  <circle cx="70" cy="70" r="66" fill="#ffffff" stroke="#163b6d" stroke-width="3"/>
  <circle cx="70" cy="70" r="60" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="70" cy="70" r="42" fill="#f4f7f4" stroke="#163b6d" stroke-width="2"/>
  
  <!-- Department text around circle -->
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0c2340" letter-spacing="0.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      DEPARTMENT OF CIVIL SUPPLIES
    </textPath>
  </text>
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#1b5e20" letter-spacing="0.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF ANDHRA PRADESH
    </textPath>
  </text>
  
  <!-- Center: Golden Paddy Ears and Sun -->
  <circle cx="70" cy="55" r="9" fill="#f59e0b" opacity="0.9"/>
  <!-- Rising Sun Rays -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round">
    <line x1="70" y1="42" x2="70" y2="40"/>
    <line x1="60" y1="46" x2="58" y2="44"/>
    <line x1="80" y1="46" x2="82" y2="44"/>
    <line x1="55" y1="55" x2="53" y2="55"/>
    <line x1="85" y1="55" x2="87" y2="55"/>
  </g>
  
  <!-- Stylized Paddy stalks curving left and right -->
  <!-- Left Stalk -->
  <path d="M 68,90 Q 56,76 60,62" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="58" cy="65" rx="3" ry="5" transform="rotate(-25 58 65)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  <ellipse cx="55" cy="72" rx="3" ry="5" transform="rotate(-40 55 72)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  <ellipse cx="58" cy="80" rx="3" ry="5" transform="rotate(-30 58 80)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  
  <!-- Right Stalk -->
  <path d="M 72,90 Q 84,76 80,62" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="82" cy="65" rx="3" ry="5" transform="rotate(25 82 65)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  <ellipse cx="85" cy="72" rx="3" ry="5" transform="rotate(40 85 72)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  <ellipse cx="82" cy="80" rx="3" ry="5" transform="rotate(30 82 80)" fill="#eab308" stroke="#2e7d32" stroke-width="0.8"/>
  
  <!-- Base Ribbon / Slogan -->
  <path d="M 50,92 L 90,92 L 86,98 L 70,96 L 54,98 Z" fill="#163b6d"/>
  <text x="70" y="96" font-family="'Segoe UI', sans-serif" font-size="4.5" font-weight="bold" fill="#ffffff" text-anchor="middle">e-PADDY PORTAL</text>
</svg>
